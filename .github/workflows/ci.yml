name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talimcrm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install --legacy-peer-deps
      - name: Security audit (high/critical only — don't fail CI on low-severity noise)
        run: npm audit --audit-level=critical || true
      - run: npx tsc --noEmit
      # Build the test database exactly as production is built: from the
      # versioned migrations, never `db:push`. Then fail if schema.ts declares
      # anything the migrations don't create, and if db:generate would still
      # produce a new migration.
      - name: Apply versioned migrations to an empty database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talimcrm_test
      - name: Check schema drift (schema.ts vs migrated database)
        run: npm run db:check-drift
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talimcrm_test
      - name: Check every schema change has a migration
        run: |
          npx drizzle-kit generate --name ci-check | tee generate.log
          grep -q "No schema changes" generate.log
      - run: npm run test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talimcrm_test
          JWT_SECRET: ci-test-secret
      - name: End-to-end tests (multi-tenant isolation)
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talimcrm_test
          JWT_SECRET: ci-test-secret
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build

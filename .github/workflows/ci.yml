name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talimcrm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talimcrm_test
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Exactly what package-lock.json says, or fail: no silent version drift
      # between a developer's machine, CI and the production image.
      # (--legacy-peer-deps: tsconfck declares an optional peer on
      # TypeScript 5 while the project is on TypeScript 6.)
      - run: npm ci --legacy-peer-deps

      # Audit policy:
      #  - Packages that ship in the production image (--omit=dev) must have
      #    no HIGH or CRITICAL advisory. This step fails the build.
      #  - MODERATE and lower are reviewed by hand (today: exceljs -> uuid,
      #    whose only offered "fix" is a major downgrade of exceljs).
      #  - Build/test tooling is reported below but does not fail the build:
      #    it never runs in production.
      #  Never `npm audit fix --force`: upgrades are made one by one, tested.
      - name: Security audit - production dependencies (blocking, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Security audit - build and test tooling (report only)
        run: npm audit --audit-level=high
        continue-on-error: true

      - run: npx tsc --noEmit
      - run: npm run lint

      # The migration list itself: every SQL file is in the journal, in
      # order, and the journal names no missing file.
      - name: Check the migration journal
        run: npm run db:check-migrations
      # Build the test database exactly as production is built: with
      # `npm run db:migrate` (scripts/migrate.cjs - one transaction per
      # migration; the container runs the same file on start). Never
      # `db:push`, and not `drizzle-kit migrate`: it applies every file in
      # one transaction, which PostgreSQL refuses once a migration uses an
      # enum value added by an earlier one. Then fail if schema.ts declares
      # anything the migrations don't create, and if db:generate would still
      # produce a new migration.
      - name: Apply versioned migrations to an empty database
        run: npm run db:migrate
      - name: Check schema drift (schema.ts vs migrated database)
        run: npm run db:check-drift
      - name: Check every schema change has a migration
        run: |
          npx drizzle-kit generate --name ci-check | tee generate.log
          grep -q "No schema changes" generate.log
      # The same command on scratch databases: empty -> current; existing
      # databases with rows (an early baseline, and 0031) -> current with the
      # rows untouched; an enum value added and used across migrations; a
      # database drizzle-kit migrated in the past adopted; an unknown one
      # refused.
      - name: Verify fresh install and upgrade paths
        run: npm run db:verify-migrations

      - run: npm run test
      - name: End-to-end tests (real PostgreSQL; AI, e-mail, Telegram and SMS are off)
        run: npm run test:e2e
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Same policy as the backend: nothing HIGH or CRITICAL in what ships.
      - name: Security audit - production dependencies (blocking, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  # The production images themselves: built from both Dockerfiles and run on
  # a throw-away database (docker-compose.smoke.yml). Checks that migrations
  # finish before the API answers, health and a round trip through the API,
  # and that a restart applies nothing twice. No external service is
  # configured.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The script's own text checks, on a log far larger than a pipe
      # buffer (the first version failed on exactly that).
      - name: Test the smoke-test helpers
        run: bash scripts/production/smoke-lib.test.sh
      - name: Build and smoke-test the production images
        run: bash scripts/production/smoke-test.sh

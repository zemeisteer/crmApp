name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talimcrm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talimcrm_test
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Exactly what package-lock.json says, or fail: no silent version drift
      # between a developer's machine, CI and the production image.
      # (--legacy-peer-deps: tsconfck declares an optional peer on
      # TypeScript 5 while the project is on TypeScript 6.)
      - run: npm ci --legacy-peer-deps

      # Audit policy:
      #  - Packages that ship in the production image (--omit=dev) must have
      #    no HIGH or CRITICAL advisory. This step fails the build.
      #  - MODERATE and lower are reviewed by hand (today: exceljs -> uuid,
      #    whose only offered "fix" is a major downgrade of exceljs).
      #  - Build/test tooling is reported below but does not fail the build:
      #    it never runs in production.
      #  Never `npm audit fix --force`: upgrades are made one by one, tested.
      - name: Security audit - production dependencies (blocking, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Security audit - build and test tooling (report only)
        run: npm audit --audit-level=high
        continue-on-error: true

      - run: npx tsc --noEmit
      - run: npm run lint

      # The migration list itself: every SQL file is in the journal, in
      # order, and the journal names no missing file.
      - name: Check the migration journal
        run: npm run db:check-migrations
      # Build the test database exactly as production is built: with
      # `npm run db:migrate` (scripts/migrate.cjs - one transaction per
      # migration; the container runs the same file on start). Never
      # `db:push`, and not `drizzle-kit migrate`: it applies every file in
      # one transaction, which PostgreSQL refuses once a migration uses an
      # enum value added by an earlier one. Then fail if schema.ts declares
      # anything the migrations don't create, and if db:generate would still
      # produce a new migration.
      - name: Apply versioned migrations to an empty database
        run: npm run db:migrate
      - name: Check schema drift (schema.ts vs migrated database)
        run: npm run db:check-drift
      - name: Check every schema change has a migration
        run: |
          npx drizzle-kit generate --name ci-check | tee generate.log
          grep -q "No schema changes" generate.log
      # The same command on scratch databases: empty -> current; existing
      # databases with rows (an early baseline, and 0031) -> current with the
      # rows untouched; an enum value added and used across migrations; a
      # database drizzle-kit migrated in the past adopted; an unknown one
      # refused.
      - name: Verify fresh install and upgrade paths
        run: npm run db:verify-migrations

      - run: npm run test
      - name: End-to-end tests (real PostgreSQL; AI, e-mail, Telegram and SMS are off)
        run: npm run test:e2e
      - run: npm run build

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Same policy as the backend: nothing HIGH or CRITICAL in what ships.
      - name: Security audit - production dependencies (blocking, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - run: npx tsc --noEmit
      - run: npm run lint
      # Pure helpers (the center's clock for lead dates), in a timezone far
      # from the centers' so a browser-local mistake would show.
      - run: npm test
        env:
          TZ: America/Los_Angeles
      - run: npm run build

  # The deployment scripts, without Docker: which stack they act on, where
  # the staging check may send requests, backups under controlled failures,
  # the certificate and restore command sequences. Docker is a recording
  # fake in these tests; nothing real is started or removed.
  ops-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Scripts are committed as executable
        run: |
          not_executable="$(git ls-files -s 'scripts/*.sh' | awk '$1 != "100755" {print $4}')"
          if [ -n "$not_executable" ]; then echo "not executable in git:"; echo "$not_executable"; exit 1; fi
      - name: Shell syntax
        run: for f in scripts/production/*.sh scripts/staging/*.sh; do bash -n "$f"; done
      - name: Stack selection (staging guard, pinned Compose project)
        run: bash scripts/staging/tooling.test.sh
      - name: Destination rules of the staging check
        run: node --test scripts/staging/target.test.mjs
      - name: Backups under controlled failures
        run: bash scripts/production/backup-core.test.sh
      - name: Certificate, backup and restore command sequences
        run: bash scripts/production/ops.test.sh
      - name: Recovery rehearsal logic (certbot check, failure report, redaction)
        run: bash scripts/production/rehearsal.test.sh
      - name: Off-server copies (transfer faults, retries, fetch; local stand-ins)
        run: bash scripts/production/offsite.test.sh

  # The production images themselves: built from both Dockerfiles and run on
  # a throw-away database (docker-compose.smoke.yml). Checks that migrations
  # finish before the API answers, health and a round trip through the API,
  # and that a restart applies nothing twice. No external service is
  # configured.
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The script's own text checks, on a log far larger than a pipe
      # buffer (the first version failed on exactly that).
      - name: Test the smoke-test helpers
        run: bash scripts/production/smoke-lib.test.sh
      # The production compose file must stay valid with both environment
      # templates (the staging one runs the same file under other names).
      - name: Validate the production compose file with the env templates
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env.production.example config -q
          docker compose -f docker-compose.prod.yml --env-file .env.staging.example config -q
          resolved="$(docker compose -f docker-compose.prod.yml --env-file .env.staging.example config)"
          grep -q 'container_name: talimcrm_staging_postgres' <<<"$resolved"
          if grep -q 'container_name: talimcrm_postgres' <<<"$resolved"; then echo "staging resolves to a production container name"; exit 1; fi
      - name: Build and smoke-test the production images
        run: bash scripts/production/smoke-test.sh

  # Recovery rehearsal in disposable containers: the production compose
  # file behind nginx with HTTPS, a real backup (database + uploads), a real
  # failing backup, a restore into a separate database and uploads volume,
  # and the application verified on the restored copy.
  browser:
    # Critical flows in a real browser (Chromium), against the production
    # builds of the backend and the frontend on a disposable database. The
    # backend runs with NODE_ENV=development only for its http://*.localhost
    # CORS rules. No external provider is configured.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BROWSER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talimcrm_browser_e2e
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talimcrm_browser_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --legacy-peer-deps
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e-browser
      - run: npx playwright install --with-deps chromium
        working-directory: e2e-browser
      - run: npm run build:frontend
        working-directory: e2e-browser
      - run: npm test
        working-directory: e2e-browser
      # Screenshots of synthetic data only (no traces: they would hold tokens).
      - name: Keep the failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: |
            e2e-browser/test-results
            e2e-browser/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Backup, restore and TLS rehearsal
        env:
          # Redacted failure report only (no env files, dumps or tokens).
          REHEARSAL_DIAG_DIR: ${{ runner.temp }}/rehearsal-diagnostics
        run: bash scripts/production/restore-rehearsal.sh
      - name: Keep the redacted failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rehearsal-diagnostics
          path: ${{ runner.temp }}/rehearsal-diagnostics
          if-no-files-found: ignore
          retention-days: 7

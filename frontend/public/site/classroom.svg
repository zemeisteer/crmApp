<text x="440" y="176" font-size="38" font-weight="800">Present Perfect</text>
<text x="440" y="226" font-size="24" fill="#4A5163">I <tspan style="fill:var(--accent,#4F46E5)" font-weight="700">have visited</tspan> Samarkand.</text>
<text x="440" y="266" font-size="24" fill="#4A5163">She <tspan style="fill:var(--accent,#4F46E5)" font-weight="700">has finished</tspan> her work.</text>
<text x="440" y="330" font-size="22" fill="#6B7285">have / has + V3</text>
</g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6F1E8"/><stop offset="1" stop-color="#E9E0D1"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9A67E"/><stop offset="1" stop-color="#A9825A"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FD0F5"/><stop offset="1" stop-color="#DDF0FB"/></linearGradient>
<linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF1F5"/></linearGradient>
<linearGradient id="ray" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF7D6" stop-opacity=".55"/><stop offset="1" stop-color="#FFF7D6" stop-opacity="0"/></linearGradient>
<linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7D3B6"/><stop offset="1" stop-color="#CDB08A"/></linearGradient>
<linearGradient id="blazer" x1="0" y1="0" x2="1" y2="1"><stop style="stop-color:var(--accent,#4F46E5)" offset="0"/><stop offset="1" stop-color="#1E1B4B"/></linearGradient>
<radialGradient id="vig" cx=".5" cy=".45" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#1B130A" stop-opacity=".28"/></radialGradient>
<radialGradient id="skin" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#F3CFAE"/><stop offset="1" stop-color="#D9A57F"/></radialGradient>
<clipPath id="win"><rect x="64" y="112" width="238" height="348" rx="4"/></clipPath>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3B2A17" flood-opacity=".22"/></filter>
</defs>
<!-- room -->
<rect width="1200" height="900" fill="url(#wall)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A2F4A"/><stop offset="1" stop-color="#161827"/></linearGradient>
<linearGradient id="win2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7A96B"/><stop offset=".55" stop-color="#E98A8A"/><stop offset="1" stop-color="#7C6AB8"/></linearGradient>
<linearGradient id="table" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C79A6B"/><stop offset="1" stop-color="#8E6541"/></linearGradient>
<linearGradient id="lap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D5D9E2"/><stop offset="1" stop-color="#A9AFBC"/></linearGradient>
<linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F4F8"/></linearGradient>
<linearGradient id="hood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#C2410C"/></linearGradient>
<radialGradient id="lamp" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#FFE7A8" stop-opacity=".75"/><stop offset="1" stop-color="#FFE7A8" stop-opacity="0"/></radialGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#B9C2FF" stop-opacity=".45"/><stop offset="1" stop-color="#B9C2FF" stop-opacity="0"/></radialGradient>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter>
<filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<!-- evening window -->
<rect x="70" y="60" width="420" height="440" rx="10" fill="url(#win2)"/>
<circle cx="330" cy="330" r="60" fill="#FFD9A0" opacity=".9"/>
<path d="M70 420 L140 360 L200 390 L270 330 L340 380 L420 320 L490 360 L490 500 L70 500 Z" fill="#4B3F7A" opacity=".85"/>
<path d="M70 460 L160 420 L260 450 L360 410 L490 440 L490 500 L70 500 Z" fill="#35295E"/>
<path d="M280 60 V500 M70 280 H490" stroke="#2A2F4A" stroke-width="12"/>
<rect x="62" y="52" width="436" height="456" rx="14" fill="none" stroke="#3A3F5C" stroke-width="16"/>
<!-- shelf with books -->
<rect x="640" y="150" width="480" height="14" rx="4" fill="#8E6541"/>
<g>
<rect x="660" y="72" width="26" height="78" rx="3" fill="#60A5FA"/>
<rect x="690" y="84" width="22" height="66" rx="3" fill="#F472B6"/>
<rect x="716" y="64" width="30" height="86" rx="3" fill="#34D399"/>
<rect x="750" y="90" width="20" height="60" rx="3" fill="#FBBF24"/>
<rect style="fill:var(--accent,#4F46E5)" x="780" y="80" width="26" height="70" rx="3" transform="rotate(12 793 150)"/>
<circle cx="1060" cy="118" r="30" fill="#3E8E57"/>
<rect x="1040" y="118" width="40" height="32" rx="6" fill="#E5E7EB"/>
</g>
<!-- table -->
<rect x="0" y="560" width="1200" height="340" fill="url(#table)"/>
<rect x="0" y="556" width="1200" height="10" fill="#D8AE80"/>
<!-- lamp (stands on the table) -->
<g transform="translate(0 64)">
<path d="M1000 520 L1030 330" stroke="#E5E7EB" stroke-width="10" stroke-linecap="round"/>
<path d="M1030 330 L950 300" stroke="#E5E7EB" stroke-width="10" stroke-linecap="round"/>
<path d="M905 280 L990 280 L975 330 L920 330 Z" fill="#F4F4F5"/>
<path d="M905 330 L990 330 L1120 560 L760 560 Z" fill="url(#lamp)"/>
<ellipse cx="1000" cy="522" rx="48" ry="12" fill="#D4D4D8"/>
</g>
<!-- mug, notebook, phone -->
<g filter="url(#sh2)">
<rect x="930" y="600" width="210" height="150" rx="8" fill="#FEF3C7" transform="rotate(-8 1035 675)"/>
<path d="M950 628 H1100 M952 652 H1080 M955 676 H1095 M958 700 H1060" stroke="#D6C28F" stroke-width="3" transform="rotate(-8 1035 675)"/>
<rect x="1016" y="700" width="100" height="120" rx="16" fill="#F8FAFC"/>
<path d="M1116 730 q40 0 40 30 q0 30 -40 30" stroke="#F8FAFC" stroke-width="14" fill="none"/>
<ellipse cx="1066" cy="704" rx="44" ry="10" fill="#6B4226"/>
<rect x="760" y="660" width="80" height="150" rx="14" fill="#111827" transform="rotate(14 800 735)"/>
<rect x="768" y="670" width="64" height="126" rx="9" fill="#312E81" transform="rotate(14 800 735)"/>
</g>
<path d="M1050 680 q-10 -30 6 -50 M1076 678 q-10 -34 8 -56" stroke="#fff" stroke-opacity=".35" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#blur6)"/>
<!-- laptop -->
<ellipse cx="600" cy="560" rx="360" ry="120" fill="url(#glow)"/>
<g filter="url(#sh2)">
<path d="M300 200 Q300 184 316 184 H884 Q900 184 900 200 V560 H300 Z" fill="#1F2330"/>
<rect x="318" y="202" width="564" height="340" rx="6" fill="url(#screen)"/>
<path d="M250 560 H950 L990 610 Q992 620 980 620 H220 Q208 620 210 610 Z" fill="url(#lap)"/>
<rect x="540" y="562" width="120" height="10" rx="5" fill="#9097A6"/>
</g>
<!-- chat UI -->
<g font-family="Inter, sans-serif">
<rect style="fill:var(--accent,#4F46E5)" x="318" y="202" width="564" height="46" rx="6"/>
<rect style="fill:var(--accent,#4F46E5)" x="318" y="230" width="564" height="18"/>
<circle cx="346" cy="225" r="13" fill="#fff" opacity=".95"/>
<text style="fill:var(--accent,#4F46E5)" x="340" y="231" font-size="15">✦</text>
<text x="368" y="231" font-size="16" font-weight="700" fill="#fff">AI yordamchi</text>
<circle cx="858" cy="225" r="5" fill="#86EFAC"/>
<rect x="560" y="266" width="300" height="44" rx="14" fill="#EEF0FF"/>
<text x="578" y="294" font-size="15" fill="#1F2533">"have been" qachon ishlatiladi?</text>
<rect x="340" y="326" width="400" height="118" rx="14" fill="#fff" stroke="#E5E7EB"/>
<text x="358" y="354" font-size="14.5" fill="#1F2533">Hozirgacha davom etayotgan ish uchun:</text>
<text style="fill:var(--accent,#4F46E5)" x="358" y="382" font-size="14.5" font-weight="700">I have been studying for 2 hours.</text>
<text x="358" y="410" font-size="14" fill="#6B7285">Yana misol kerakmi? Sizga 3 ta mashq</text>
<text x="358" y="430" font-size="14" fill="#6B7285">tayyorlab beraman ✍️</text>
<rect x="640" y="460" width="220" height="40" rx="14" fill="#EEF0FF"/>
<text x="658" y="486" font-size="15" fill="#1F2533">Ha, mashq bering 👍</text>
<rect x="340" y="512" width="520" height="24" rx="12" fill="#F3F4F6"/>
<text x="356" y="529" font-size="12.5" fill="#9CA3AF">Savolingizni yozing…</text>
</g>
<!-- student over the shoulder (back view, left) -->
<g>
<path d="M-40 900 Q-30 690 150 650 Q300 640 360 760 Q380 830 370 900 Z" fill="url(#hood)"/>
<path d="M40 700 Q120 640 230 660" stroke="#9A3412" stroke-opacity=".35" stroke-width="18" fill="none" stroke-linecap="round"/>
<ellipse cx="180" cy="560" rx="98" ry="112" fill="#1C1410"/>
<path d="M90 560 Q96 470 180 456 Q268 470 272 560 Q246 510 180 508 Q116 510 90 560 Z" fill="#2B1F18"/>
<ellipse cx="274" cy="584" rx="11" ry="17" fill="#E0A77E"/>
<!-- arm to keyboard -->
<path d="M300 780 Q380 700 470 640" stroke="#EA580C" stroke-width="54" stroke-linecap="round" fill="none"/>
<ellipse cx="486" cy="628" rx="28" ry="20" fill="#E0A77E"/>
</g>
</svg>

# TalimCRM - production stack. The same file runs STAGING: every name that
# could collide is taken from the environment, with defaults that are
# exactly what production has always used.
#
#   STACK_NAME            container-name prefix        (default talimcrm)
#   COMPOSE_PROJECT_NAME  volumes and network prefix   (default: folder name)
#   HTTP_PORT/HTTPS_PORT  published ports              (default 80 / 443)
#   BACKUP_DIR            where recovery sets go       (default ./backups)
#
# Staging lives in its own checkout with its own .env (see
# .env.staging.example and docs/STAGING.md): different STACK_NAME and
# COMPOSE_PROJECT_NAME give it its own containers, database volume, uploads
# volume, certificates and network. Nothing is shared with production.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ${STACK_NAME:-talimcrm}_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be defined}
      POSTGRES_DB: ${POSTGRES_DB:-talimcrm}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=200
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-talimcrm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talimcrm_net

  redis:
    image: redis:7-alpine
    container_name: ${STACK_NAME:-talimcrm}_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-talimcrmredisprodpass}"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-talimcrmredisprodpass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talimcrm_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
      args:
        # The checkout's commit (scripts/production/lib.sh sets it).
        APP_REVISION: ${APP_REVISION:-unknown}
    container_name: ${STACK_NAME:-talimcrm}_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-talimcrm}
      REDIS_URL: redis://:${REDIS_PASSWORD:-talimcrmredisprodpass}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be defined}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-https://${DOMAIN}}
      # Main domain: centers live on <sub>.${DOMAIN}; also limits CORS.
      ROOT_DOMAIN: ${DOMAIN:?DOMAIN must be defined}
      # Optional external integrations
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      ESKIZ_API_TOKEN: ${ESKIZ_API_TOKEN:-}
      ESKIZ_SENDER: ${ESKIZ_SENDER:-}
      PLAYMOBILE_API_TOKEN: ${PLAYMOBILE_API_TOKEN:-}
      PLAYMOBILE_ORIGINATOR: ${PLAYMOBILE_ORIGINATOR:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Automatic reminders scan interval (ms); 0 turns them off.
      REMINDER_SCAN_MS: ${REMINDER_SCAN_MS:-300000}
      EMAIL_FROM: ${EMAIL_FROM:-}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
      PAYME_KEY: ${PAYME_KEY:-}
      PLATFORM_CLICK_MERCHANT_ID: ${PLATFORM_CLICK_MERCHANT_ID:-}
      PLATFORM_CLICK_SERVICE_ID: ${PLATFORM_CLICK_SERVICE_ID:-}
      PLATFORM_CLICK_SECRET_KEY: ${PLATFORM_CLICK_SECRET_KEY:-}
      PLATFORM_PAYME_MERCHANT_ID: ${PLATFORM_PAYME_MERCHANT_ID:-}
      PLATFORM_PAYME_KEY: ${PLATFORM_PAYME_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-TalimCRM <no-reply@crmapp.uz>}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - uploads_prod_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - talimcrm_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_ROOT_DOMAIN: ${DOMAIN:?DOMAIN must be defined}
        APP_REVISION: ${APP_REVISION:-unknown}
    container_name: ${STACK_NAME:-talimcrm}_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    networks:
      - talimcrm_net

  nginx:
    image: nginx:1.27-alpine
    container_name: ${STACK_NAME:-talimcrm}_nginx
    restart: always
    # Reload every 12h so renewed certificates are picked up.
    command: ["/bin/sh", "-c", "while :; do sleep 12h; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - uploads_prod_data:/app/uploads:ro
    depends_on:
      - frontend
      - backend
    networks:
      - talimcrm_net

  certbot:
    image: certbot/dns-cloudflare:latest
    container_name: ${STACK_NAME:-talimcrm}_certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # The renewal loop is the default COMMAND of a shell entrypoint. Anything
    # that needs certbot itself (the first certificate in init-ssl.sh) runs
    # it with `--entrypoint certbot`: arguments given to `compose run` only
    # replace the command, they do not get past a shell entrypoint.
    entrypoint: ["/bin/sh", "-c"]
    command: ["trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"]

  # Nightly recovery set: the database AND the uploaded files, checked before
  # it is accepted (scripts/production/backup-core.sh - the same script a
  # manual backup runs, so the two cannot differ). Times are UTC.
  db-backup:
    image: postgres:16-alpine
    container_name: ${STACK_NAME:-talimcrm}_backup
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-talimcrm}
      STACK_NAME: ${STACK_NAME:-talimcrm}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_MIN_KEEP: ${BACKUP_MIN_KEEP:-3}
      # 22:00 UTC = 03:00 in Tashkent.
      BACKUP_AT_UTC: ${BACKUP_AT_UTC:-22:00}
      # 1: every set is restored into a scratch database before it counts.
      BACKUP_VERIFY_RESTORE: ${BACKUP_VERIFY_RESTORE:-1}
      APP_REVISION: ${APP_REVISION:-unknown}
      # Off-server copies configured: old sets are pruned only once copied.
      BACKUP_OFFSITE_REQUIRED: ${OFFSITE_DRIVER:+1}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - uploads_prod_data:/uploads:ro
      - ./scripts/production/backup-core.sh:/opt/talimcrm/backup-core.sh:ro
    entrypoint: ["sh", "/opt/talimcrm/backup-core.sh"]
    command: ["daemon"]
    healthcheck:
      test: ["CMD", "sh", "/opt/talimcrm/backup-core.sh", "healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 1
    networks:
      - talimcrm_net

networks:
  talimcrm_net:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  uploads_prod_data:
  certbot_conf:
  certbot_www:
